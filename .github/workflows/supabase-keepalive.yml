# Supabase 無料プランの自動ポーズ防止。
# 無料プロジェクトは 7 日間 API リクエストが無いとポーズされ、ポーズから 90 日で永久凍結される
# （ENdLISS で 2026-10 に実際に凍結直前まで行った）。週 2 回 REST API を叩いて「利用中」の状態を保つ。
# この Supabase は GoLocal Booking と共用（xwmyvdnvchcnfywpbjjm）。ft_ テーブルは anon 不可のため GoLocal 側の restaurants を参照する
#
# 併せて GitHub 側の仕様（リポジトリに 60 日間コミットが無いと scheduled workflow が自動停止される）
# への対策として、最終コミットから 45 日以上経っていればタイムスタンプファイルを更新してコミットする。
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 21 * * 1,4' # 月・木 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # anon キーはブラウザに配布される公開キー（NEXT_PUBLIC_）なのでここに置いて問題ない。
      # 読める範囲は RLS の設定どおり。ここでは restaurants の id を 1 件取るだけ（結果が空でも DB に到達すれば十分）
      SUPABASE_URL: https://xwmyvdnvchcnfywpbjjm.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bXl2ZG52Y2hjbmZ5d3BiamptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTE1MTQsImV4cCI6MjA5NzUyNzUxNH0.KENOMimPH9na7mMb9TtA8LDi-c7F5qdg9VjaDA5RfG4
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase REST (counts as project activity)
        run: |
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1")
          echo "HTTP $code: $(head -c 200 /tmp/body.txt)"
          # 200 以外（ポーズ中は 521/5xx）は失敗にして GitHub からの通知メールで気付けるようにする
          test "$code" = "200"

      - name: Keep scheduled workflow enabled (dummy commit every 45+ days)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
            git add .github/keepalive
            git commit -m 'chore: keep scheduled workflows alive'
            git push
          fi
